services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: multimodal_qa_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Optional: If you have a GPU and want to pass it to the backend container, 
    # you can uncomment the following section (requires nvidia-docker2 or docker-compose gpu support):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: multimodal_qa_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000/process
    depends_on:
      - backend
